const TXT=[['Welcome to Our Little Universe','Two souls. One universe. Endless love.'],['Our Special Planet','Tap Mansi’s planet'],['Constellation of Memories','Tap a star to relive a memory'],['Our Love Infinity','Even if the universe had no ending, my love for you would still go beyond it.'],['A Secret Message','A little something, just for you']];
const NAME=['Galaxy','Planets','Memories','Infinity','Secret'];
let stage=0,started=false,goalP=new THREE.Vector3(0,0,170),goalT=new THREE.Vector3(),bp=new THREE.Vector3(0,0,170),bt=new THREE.Vector3(),mx=0,my=0,heartTimer=0;
const nav=$('nav');NAME.forEach((n,i)=>{const b=document.createElement('button');b.textContent='✦ '+n;b.onclick=()=>go(i);nav.appendChild(b)});
function setGoal(g){goalP.set(...g.p);goalT.set(...g.t)}
function closeAll(){document.querySelectorAll('.card').forEach(c=>c.classList.remove('on'));setGoal(G[stage])}
function go(i){closeAll();stage=i;setGoal(G[i]);[...nav.children].forEach((b,k)=>b.classList.toggle('a',k==i));
 const c=$('cap');c.classList.remove('on');setTimeout(()=>{$('ct').textContent=TXT[i][0];$('cs').textContent=TXT[i][1];c.classList.add('on')},500);
 $('lbMe').classList.toggle('on',i==1);$('lbMa').classList.toggle('on',i==1);$('openbtn').classList.toggle('on',i==4);
 if(i==1||i==3)burst(10)}
function burst(n){const e=['💖','💗','💞','❤️','✨','💜'];for(let i=0;i<n;i++)setTimeout(()=>{const s=document.createElement('span');s.className='fh';s.textContent=e[Math.random()*e.length|0];s.style.left=Math.random()*100+'vw';s.style.fontSize=14+Math.random()*26+'px';document.body.appendChild(s);setTimeout(()=>s.remove(),4600)},i*120)}
document.querySelectorAll('.x').forEach(b=>b.onclick=closeAll);

/* intro */
async function type(el,t,sp=60){el.textContent='';for(const ch of t){el.textContent+=ch;await sleep(sp)}}
(async()=>{await sleep(2500);await type($('l1'),'Out of billions of galaxies...');await sleep(700);await type($('l2'),'Out of trillions of stars...');await sleep(900);await type($('l3'),'I found my universe in YOU.',80);await sleep(700);$('name').style.opacity=1;await sleep(1800);$('enter').style.opacity=1})();

const bgMusic = $('bgMusic');
bgMusic.volume = 0.35;

$('enter').onclick = () => {
    started = true;

    // Start background music
    bgMusic.play().catch(error => {
        console.log("Music playback failed:", error);
    });

    // Existing intro animation
    $('intro').classList.add('out');
    setGoal(G[0]);
    nav.classList.add('on');
    go(0);
    burst(8);
};


/* interaction */
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth*2-1;my=e.clientY/innerHeight*2-1});
const rc=new THREE.Raycaster(),v=new THREE.Vector2();
cv.addEventListener('pointerdown',e=>{if(!started)return;v.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight*2-1));rc.setFromCamera(v,cam);
 if(stage==1){const h=rc.intersectObjects([pMa.m,pMe.m])[0];if(!h)return;const ma=h.object==pMa.m;
  $('pt').textContent=ma?'Mansi ❤️':'Me ❤️';$('pp').textContent=ma?'You are not just a part of my universe. You ARE my universe.':'I will keep orbiting you, always.';$('pop').classList.add('on');burst(ma?26:10)}
 if(stage==2){const h=rc.intersectObjects(mS)[0];if(!h)return;const m=MEMORIES[h.object.userData.i],w=h.object.getWorldPosition(new THREE.Vector3());
  goalP.set(w.x,w.y,w.z+6);goalT.copy(w);$('mt').textContent=m.t;$('mc').textContent=m.c;$('md').textContent=m.d;
  $('mph').innerHTML=m.img?'<img alt="" src="'+m.img+'">':'📷';setTimeout(()=>$('mem').classList.add('on'),900);burst(6)}});
$('openbtn').onclick=()=>{$('letter').classList.add('on');burst(24);type($('lp'),LETTER,38)};

if(THREE.UnrealBloomPass){comp=new THREE.EffectComposer(R);comp.addPass(new THREE.RenderPass(S,cam));comp.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.85,.7,.18))}else comp={render(){R.render(S,cam)},setSize(){}};
comp.setSize(innerWidth,innerHeight);
/* loop */
const clk=new THREE.Clock(),tmp=new THREE.Vector3();
function lab(el,obj){obj.getWorldPosition(tmp);tmp.y+=2.4;tmp.project(cam);el.style.left=(tmp.x*.5+.5)*innerWidth+'px';el.style.top=(-tmp.y*.5+.5)*innerHeight+'px'}
(function loop(){requestAnimationFrame(loop);const t=clk.getElapsedTime();
 TU.value=t;stars.material.uniforms.o.value=Math.min(1,t/7);dust.material.uniforms.o.value=Math.min(.9,t/9);gal.rotation.z=t*.006;stars.rotation.y=t*.004;dust.rotation.y=-t*.01;neb.rotation.y=t*.003;
 const pu=1+Math.sin(t*2.2)*.07;heart.scale.setScalar(.07*pu);heart.rotation.y=Math.sin(t*.5)*.5;halo.material.opacity=.45+Math.sin(t*2.2)*.15;pl.intensity=2.2+Math.sin(t*2.2)*.6;
 decor.forEach(d=>{const a=d.a+t*d.s;d.g.position.set(Math.cos(a)*d.r,Math.sin(a*1.3)*2,Math.sin(a)*d.r);d.g.rotation.y=t*.3});
 const oa=t*.5;pMe.g.position.set(Math.cos(oa)*7,Math.sin(t)*.6,Math.sin(oa)*7);pMa.g.position.set(-Math.cos(oa)*7,Math.sin(t+2)*.6,-Math.sin(oa)*7);
 mS.forEach((s,i)=>{const k=1+Math.sin(t*2+i)*.2;s.scale.set(3.2*k,3.2*k,1)});
 const pa=ig.attributes.position;for(let i=0;i<N;i++){const b=base[i],w=Math.sin(t*1.5+i*.05)*.5;pa.setXYZ(i,b[0]+b[2][0]*(1.2+w),b[1]+b[2][1]*(1.2+w),b[2][2]*3+Math.sin(t+i*.02))}pa.needsUpdate=true;
 {const a=t*.6,d=1+Math.sin(a)**2;runner.position.set(16*Math.cos(a)/d,16*Math.sin(a)*Math.cos(a)/d,0)}
 sG.rotation.y=Math.sin(t*.4)*.5;sG.scale.setScalar(1+Math.sin(t*2.2)*.04);
 if(stage==3&&started&&t-heartTimer>2.5){heartTimer=t;burst(4)}
 bp.lerp(goalP,.035);bt.lerp(goalT,.05);cam.position.set(bp.x+mx*2.2,bp.y-my*1.5+(started?0:Math.sin(t*.3)*3),bp.z);cam.lookAt(bt);
 if(!started)goalP.z=170-Math.min(t,12)*2;
 lab($('lbMe'),pMe.g);lab($('lbMa'),pMa.g);
 comp.render()})();
</script>
</body>
</html>
